<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management | CRUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-animate">
        <div class="bg-grid"></div>
    </div>
    
    <div class="cursor-glow" id="cursor"></div>

    <nav>
        <div class="logo">DEPARTMENT MANAGEMENT SYSTEM</div>
    </nav>

    <div class="main-container">
        <header style="margin-bottom: 30px;">
            <h2 style="color: white;">Registry Control</h2>
            <p style="color: var(--text-dim); font-size: 0.85rem;">Standard ISO Formatting Enabled</p>
        </header>

        <form id="deptForm">
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-grid">
                <input type="text" id="deptName" placeholder="Department Name" required>
                <input type="text" id="deptDesc" placeholder="Description (Optional)">
                <input type="text" id="modifiedBy" placeholder="Operator Name" required>
                <select id="activeStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="submit" id="submitBtn" class="btn-primary">Add Record</button>
                <button type="button" onclick="clearForm()" class="btn-clear">Clear</button>
            </div>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Department</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Modified By</th>
                        <th>Timestamp</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="deptTableBody">
                    </tbody>
            </table>
        </div>
    </div>
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="warning-icon">⚠️</span>
                <h3>System Authorization</h3>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to <span class="highlight">PURGE</span> this department record from the registry?</p>
                <p class="sub-text">This action is logged and cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()" class="btn-cancel">Abort</button>
                <button id="confirmDeleteBtn" class="btn-confirm">Confirm Purge</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
